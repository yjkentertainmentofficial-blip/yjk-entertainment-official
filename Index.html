<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YJK Entertainment — Soloist Auditions</title>
  <meta name="description" content="YJK Entertainment is an independent entertainment company building a modern Indian pop project. Auditions are online and open to applicants aged 18 and older.">
  <meta property="og:title" content="YJK Entertainment — Soloist Auditions">
  <meta property="og:description" content="YJK Entertainment is an independent entertainment company building a modern Indian pop project. Auditions are online and open to applicants aged 18 and older.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23121217'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Montserrat, sans-serif' font-weight='800' font-size='38' fill='%23C8CCD2'%3EY%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121217;
      --text: #F2F2F2;
      --text-secondary: #9A9A9A;
      --silver: #C8CCD2;
      --text-dim: #6B6B6B;
      --wordmark-top: #E6E4EE;
      --wordmark-mid: #85858D;
      --wordmark-bot: #BDBDBD;
      --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --section-gap: 80px;
      --container-max: 1200px;
      --prose-max: 700px;
    }

    @media (min-width: 768px) {
      :root {
        --section-gap: 120px;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    :focus-visible {
      outline: 2px solid var(--silver);
      outline-offset: 4px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Wordmark Logo */
    .wordmark {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      user-select: none;
    }

    .wordmark__yjk {
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      line-height: 0.92;
      background: linear-gradient(180deg, var(--wordmark-top) 0%, var(--wordmark-mid) 50%, var(--wordmark-bot) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: block;
    }

    .wordmark__sub {
      font-family: var(--font-display);
      font-weight: 500;
      text-transform: uppercase;
      color: var(--silver);
      display: block;
    }

    .wordmark--sm .wordmark__yjk {
      font-size: clamp(1.35rem, 2.2vw, 1.75rem);
      letter-spacing: 0.04em;
    }

    .wordmark--sm .wordmark__sub {
      font-size: 0.52rem;
      letter-spacing: 0.22em;
      margin-top: 0.25rem;
      white-space: nowrap;
    }

    .wordmark--lg .wordmark__yjk {
      font-size: clamp(4.25rem, 15vw, 11.5rem);
      letter-spacing: 0.03em;
    }

    .wordmark--lg .wordmark__sub {
      font-size: clamp(0.62rem, 1.3vw, 0.9rem);
      letter-spacing: 0.28em;
      margin-top: 0.65rem;
    }

    /* Sticky Top Navigation */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      border-bottom: 1px solid var(--text-dim);
    }

    .nav-bar {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .nav-links {
      display: none;
      list-style: none;
      align-items: center;
      gap: 2.25rem;
    }

    .nav-links a {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
      transition: color 0.25s ease;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] {
      color: var(--text);
    }

    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--silver);
      color: var(--silver);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.55rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
    }

    .menu-toggle:hover {
      color: var(--text);
      border-color: var(--text);
    }

    @media (min-width: 860px) {
      .menu-toggle {
        display: none;
      }

      .nav-links {
        display: flex;
      }
    }

    /* Full-screen Mobile Menu Overlay */
    .mobile-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background-color: var(--bg);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.25rem;
      padding: 2rem;
    }

    .mobile-overlay.is-open {
      display: flex;
    }

    .mobile-overlay__close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background: transparent;
      border: 1px solid var(--silver);
      color: var(--silver);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.55rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
    }

    .mobile-overlay__close:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .mobile-overlay__links {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .mobile-overlay__links a {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }

    .mobile-overlay__links a:hover {
      color: var(--silver);
    }

    /* Page Switching */
    .page {
      display: none;
    }

    .page.is-active {
      display: block;
    }

    /* Containers & Typography */
    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .prose {
      max-width: var(--prose-max);
    }

    .label {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--silver);
      display: block;
      margin-bottom: 1.25rem;
    }

    h1, .h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.25rem, 6.5vw, 5.25rem);
      line-height: 1.04;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
    }

    h2, .h2 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.75rem, 4.5vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
    }

    h3, .h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver);
    }

    p {
      color: var(--text-secondary);
      font-size: clamp(1rem, 1.35vw, 1.125rem);
      line-height: 1.7;
    }

    p + p {
      margin-top: 1.15rem;
    }

    .lead-bright {
      color: var(--text);
      font-weight: 500;
    }

    .subline {
      font-family: var(--font-body);
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      color: var(--silver);
      letter-spacing: 0.04em;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--silver);
      color: var(--bg);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 1rem 2.25rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: 2rem;
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      padding-top: 4rem;
      padding-bottom: 4rem;
      background: radial-gradient(circle at 72% 38%, rgba(200, 204, 210, 0.06) 0%, rgba(18, 18, 23, 0) 62%);
    }

    .hero__inner {
      width: 100%;
    }

    .hero__brand {
      margin-bottom: 2.5rem;
    }

    .hero__subline {
      margin-top: 1.5rem;
    }

    .hero__cta {
      margin-top: 2.5rem;
    }

    /* Spacing between sections */
    .band {
      padding-top: var(--section-gap);
      padding-bottom: var(--section-gap);
    }

    .page-header {
      padding-top: clamp(4.5rem, 9vw, 7.5rem);
      padding-bottom: var(--section-gap);
    }

    .page-header__subline {
      margin-top: 1.25rem;
    }

    .page-header__body {
      margin-top: 1.75rem;
    }

    /* Lists & Steps */
    .clean-list {
      list-style: none;
      margin-top: 2rem;
      max-width: var(--prose-max);
    }

    .clean-list li {
      padding: 1rem 0;
      border-bottom: 1px solid var(--text-dim);
      color: var(--text);
      font-size: clamp(1rem, 1.3vw, 1.1rem);
    }

    .clean-list li:first-child {
      border-top: 1px solid var(--text-dim);
    }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      margin-top: 2.5rem;
      max-width: 920px;
    }

    @media (min-width: 768px) {
      .two-col-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 4rem;
      }
    }

    .card-block h3 {
      margin-bottom: 0.9rem;
    }

    .steps-list {
      list-style: none;
      margin-top: 2rem;
      max-width: var(--prose-max);
      display: grid;
      gap: 1.25rem;
    }

    .steps-list li {
      display: flex;
      gap: 1.25rem;
      align-items: baseline;
      color: var(--text);
      font-size: clamp(1rem, 1.3vw, 1.1rem);
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--text-dim);
    }

    .step-num {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      color: var(--silver);
      flex-shrink: 0;
    }

    /* Timeline */
    .timeline-rows {
      margin-top: 2.25rem;
      max-width: var(--prose-max);
    }

    .timeline-row {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .timeline-row:first-child {
      border-top: 1px solid var(--text-dim);
    }

    .timeline-date {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--silver);
    }

    .timeline-desc {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .timeline-row--highlight .timeline-date {
      font-size: clamp(1.5rem, 3.2vw, 2.25rem);
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .timeline-row--highlight .timeline-desc {
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 500;
    }

    .timeline-note {
      margin-top: 1.75rem;
      color: var(--text);
    }

    /* Native Audition Application Form */
    .audition-form {
      margin-top: 2.75rem;
      max-width: var(--prose-max);
      display: grid;
      gap: 2rem;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 640px) {
      .form-row-2 {
        grid-template-columns: 1fr 1fr;
        gap: 1.75rem;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .field label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver);
    }

    .field-hint {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .field input[type="text"],
    .field input[type="email"],
    .field input[type="number"],
    .field input[type="url"],
    .field textarea {
      width: 100%;
      background-color: transparent;
      border: none;
      border-bottom: 1px solid var(--text-dim);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 0.75rem 0;
      border-radius: 0;
      transition: border-color 0.2s ease;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--text-dim);
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-bottom-color: var(--silver);
    }

    .field textarea {
      resize: vertical;
      min-height: 85px;
    }

    /* Optional Artist Profile & Extra Skills Collapsible */
    .optional-panel {
      border-top: 1px solid var(--text-dim);
      border-bottom: 1px solid var(--text-dim);
    }

    .optional-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 1.25rem 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .optional-panel summary::-webkit-details-marker {
      display: none;
    }

    .optional-panel summary::after {
      content: "+";
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.35rem;
      color: var(--silver);
      flex-shrink: 0;
    }

    .optional-panel[open] summary::after {
      content: "−";
    }

    .optional-fields {
      padding-top: 0.5rem;
      padding-bottom: 2rem;
      display: grid;
      gap: 2rem;
    }

    .checkbox-group {
      display: grid;
      gap: 1.15rem;
      padding-top: 0.25rem;
    }

    .checkbox-item {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 1.15rem;
      height: 1.15rem;
      border: 1px solid var(--silver);
      background-color: transparent;
      flex-shrink: 0;
      margin-top: 0.22rem;
      cursor: pointer;
      display: grid;
      place-content: center;
    }

    .checkbox-item input[type="checkbox"]:checked {
      background-color: var(--silver);
    }

    .checkbox-item input[type="checkbox"]:checked::before {
      content: "";
      width: 0.55rem;
      height: 0.3rem;
      border-left: 2px solid var(--bg);
      border-bottom: 2px solid var(--bg);
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .checkbox-item span {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .checkbox-item a {
      color: var(--text);
      border-bottom: 1px solid var(--silver);
    }

    .form-status {
      display: none;
      padding: 1.5rem 0;
      border-top: 1px solid var(--silver);
      border-bottom: 1px solid var(--silver);
    }

    .form-status.is-visible {
      display: block;
    }

    .form-status h3 {
      color: var(--text);
      margin-bottom: 0.65rem;
    }

    .form-status p {
      font-size: 0.98rem;
      color: var(--text-secondary);
    }

    /* FAQ Accordion */
    .faq-list {
      margin-top: 2.25rem;
      max-width: var(--prose-max);
      border-top: 1px solid var(--text-dim);
    }

    .faq-item {
      border-bottom: 1px solid var(--text-dim);
    }

    .faq-item summary {
      list-style: none;
      cursor: pointer;
      padding: 1.35rem 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .faq-item summary::-webkit-details-marker {
      display: none;
    }

    .faq-item summary::after {
      content: "+";
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.35rem;
      color: var(--silver);
      flex-shrink: 0;
    }

    .faq-item[open] summary::after {
      content: "−";
    }

    .faq-answer {
      padding-bottom: 1.5rem;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Terms & Privacy Collapsible */
    .terms-panel {
      margin-top: var(--section-gap);
      max-width: var(--prose-max);
      border-top: 1px solid var(--text-dim);
      border-bottom: 1px solid var(--text-dim);
    }

    .terms-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 1.5rem 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--silver);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .terms-panel summary::-webkit-details-marker {
      display: none;
    }

    .terms-panel summary::after {
      content: "+";
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.4rem;
      color: var(--silver);
    }

    .terms-panel[open] summary::after {
      content: "−";
    }

    .terms-content {
      padding-bottom: 2rem;
    }

    .terms-list {
      list-style: none;
      display: grid;
      gap: 1.15rem;
    }

    .terms-list li {
      color: var(--text-secondary);
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .terms-list strong {
      color: var(--text);
      font-weight: 600;
    }

    .privacy-block {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--text-dim);
    }

    .privacy-block strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Principles & Inline Links */
    .principles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.75rem;
      margin-top: 2.5rem;
      max-width: var(--prose-max);
    }

    .inline-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.75rem;
      margin-top: 2.25rem;
    }

    .text-link {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--silver);
      border-bottom: 1px solid var(--silver);
      padding-bottom: 0.25rem;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .text-link:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .email-link {
      display: inline-block;
      margin-top: 2rem;
      font-family: var(--font-display);
